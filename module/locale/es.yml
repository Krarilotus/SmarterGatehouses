bugfixes: Correcciones
balance_changes: Cambios de equilibrio
enemy_gates_closed: Tratar las puertas enemigas como cerradas
enemy_gates_closed_tooltip: |-
  Las tropas planifican su ruta evitando puertas enemigas, incluso si están abiertas. Las puertas aliadas y capturadas siguen permitiendo el paso. No puede usarse junto con el atajo de asesinos de Smarter Pathing; la misma restricción se aplica si está activa cualquiera de las reglas de escaleras.
centred: Medir la distancia de cierre desde el centro
reachable_only: Ignorar enemigos que no puedan llegar a la puerta
reachable_only_tooltip: Los enemigos tras muros, fosos o acantilados no cierran la puerta cuando su zona está desconectada.
stairs_needed: Las tropas humanas necesitan escaleras
stairs_needed_tooltip: Las tropas humanas necesitan escaleras para subir a muros y techos de puertas. Experimental; desactivado por defecto.
stairs_needed_ai: Las tropas de la IA necesitan escaleras
stairs_needed_ai_tooltip: Aplica la misma regla a la IA. Los castillos sin escaleras pueden dejar sus muros sin guarnición.
assassins_climb: Los asesinos siguen trepando muros
assassins_climb_tooltip: Los asesinos escalan muros con sus garfios, así que la regla de escaleras no les afecta.
large_gatehouse_damage: Daño a distancia sobre una puerta grande (%)
large_gatehouse_damage_tooltip: Las tropas sobre una puerta grande reciben este porcentaje de daño de flechas, virotes y piedras de honda. Aguantan más en una puerta pequeña; bájalo para igualarlo. 100 = sin cambios.
remember_blocked: Recordar rutas bloqueadas (menos tirones)
remember_blocked_tooltip: |-
  Cuando la regla de escaleras no encuentra camino para una unidad tras probar todas las puertas, la misma ruta se omite brevemente para las unidades siguientes: pasan directo a la búsqueda propia del juego. Un ejército enviado de golpe ya no provoca tirones.
remember_ticks: Recordar una ruta bloqueada durante (ticks de juego)
remember_ticks_tooltip: 100 ticks son unos dos segundos a velocidad normal.
centred_tooltip: Mide desde el centro de la puerta para que los enemigos activen el cierre a la misma distancia desde cualquier lado.
tags.bugfixes: Correcciones
tags.balance: Equilibrio
