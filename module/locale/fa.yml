bugfixes: Bugfixes
balance_changes: Balance Changes
enemy_gates_closed: دوری از دروازه دشمن
enemy_gates_closed_tooltip: نیروها از دروازه باز دشمن هم دوری می‌کنند. این قانون و قوانین پله با میان‌بر
  آدمکش ناسازگارند.
centred: فاصله از مرکز دروازه
reachable_only: نادیده گرفتن دشمنان بدون راه به دروازه
reachable_only_tooltip: اگر مناطق به هم وصل نباشند، دشمنان پشت دیوار، خندق یا صخره باعث بسته شدن دروازه
  نمی‌شوند.
stairs_needed: سربازان بازیکن به پله نیاز دارند
stairs_needed_tooltip: سربازان بازیکن برای رسیدن به دیوارها و بام دروازه به پله نیاز دارند. آزمایشی؛ پیش‌فرض
  خاموش.
stairs_needed_ai: سربازان هوش مصنوعی هم به پله نیاز دارند
stairs_needed_ai_tooltip: همین قانون برای هوش مصنوعی. دیوار قلعه‌های بدون پله ممکن است بدون سرباز بماند.
assassins_climb: حشاشین همچنان بالا می‌روند
assassins_climb_tooltip: حشاشین با قلاب از دیوارها بالا می‌روند و قانون پله شامل آن‌ها نمی‌شود.
large_gatehouse_damage: آسیب دوربرد روی دروازهٔ بزرگ (٪)
large_gatehouse_damage_tooltip: سربازان بالای دروازهٔ بزرگ این سهم از آسیب تیر، تیر کمان و سنگ فلاخن را
  می‌گیرند. روی دروازهٔ کوچک بیشتر دوام می‌آورند؛ برای برابر کردن کمترش کنید. ۱۰۰ = بدون تغییر.
remember_blocked: به خاطر سپردن مسیرهای بسته (لگ کمتر)
remember_blocked_tooltip: اگر قانون پله‌ها پس از امتحان همه دروازه‌ها راهی برای یک واحد پیدا نکند، همان
  مسیر برای واحدهای بعدی مدت کوتاهی رد می‌شود و آن‌ها مستقیم از جستجوی خود بازی استفاده می‌کنند. ارتشی
  که یکجا فرستاده می‌شود دیگر بازی را کند نمی‌کند.
remember_ticks: مدت به خاطر سپردن مسیر بسته (تیک بازی)
remember_ticks_tooltip: ۱۰۰ تیک در سرعت عادی حدود دو ثانیه است.
centred_tooltip: دشمن از هر سمت در فاصله یکسان دروازه را می‌بندد.
