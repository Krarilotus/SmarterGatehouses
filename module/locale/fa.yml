enemy_gates_closed: در نظر گرفتن دروازه‌های دشمن به‌عنوان بسته در مسیریابی
enemy_gates_closed_tooltip: نیروها حتی هنگام باز بودن دروازه‌های دشمن، مسیر خود را از اطراف آن‌ها می‌چینند.
centred: سنجش فاصلهٔ بستن دروازه از مرکز آن
reachable_only: بستن فقط برای دشمنانی که به دروازه می‌رسند
reachable_only_tooltip: دشمنان در زمین دسترس‌ناپذیر باعث بسته شدن دروازه نمی‌شوند.
stairs_needed: نیروهای بازیکن به پله نیاز دارند
stairs_needed_tooltip: نیروهای بازیکن برای رسیدن به بالای دروازه‌ها از مسیر پله استفاده می‌کنند.
stairs_needed_ai: نیروهای هوش مصنوعی به پله نیاز دارند
stairs_needed_ai_tooltip: نیروهای هوش مصنوعی برای رسیدن به بالای دروازه‌ها از مسیر پله استفاده می‌کنند.
assassins_climb: اجازهٔ بالا رفتن به آدم‌کشان در هر حال
assassins_climb_tooltip: آدم‌کشان حتی با الزامی بودن پله همچنان می‌توانند از دروازه‌ها بالا بروند.
large_gatehouse_damage: آسیب دوربرد به نیروهای روی دروازه‌های بزرگ (%)
large_gatehouse_damage_tooltip: 100% برابر با آسیب دوربرد عادی است.
remember_blocked: به خاطر سپردن مسیرهای دروازهٔ اخیراً مسدودشده
remember_blocked_tooltip: نیروها پیش از آزمودن دوبارهٔ مسیری که به‌تازگی با دروازهٔ دشمن بسته شده صبر می‌کنند.
remember_ticks: مدت به خاطر سپردن مسیر بسته (تیک بازی)
centred_tooltip: دروازه‌ها فاصلهٔ نزدیک شدن دشمن را از میانهٔ دروازه می‌سنجند.
