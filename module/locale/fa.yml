bugfixes: رفع اشکال
balance_changes: تغییرات توازن
enemy_gates_closed: در نظر گرفتن دروازه‌های دشمن به‌عنوان بسته
enemy_gates_closed_tooltip: |-
  نیروها مسیر خود را با دور زدن دروازه‌های دشمن، حتی دروازه‌های باز، برنامه‌ریزی می‌کنند. دروازه‌های خودی و تصرف‌شده همچنان اجازهٔ عبور می‌دهند. این گزینه با میان‌بر آدم‌کشان در Smarter Pathing سازگار نیست؛ همین محدودیت با روشن بودن هر یک از قوانین پله نیز برقرار است.
centred: اندازه‌گیری فاصلهٔ بسته شدن از مرکز دروازه
reachable_only: نادیده گرفتن دشمنانی که به دروازه دسترسی ندارند
reachable_only_tooltip: اگر منطقهٔ آن‌ها متصل نباشد، دشمنان پشت دیوار، خندق یا صخره باعث بسته شدن دروازه نمی‌شوند.
stairs_needed: نیروهای بازیکن به پله نیاز دارند
stairs_needed_tooltip: نیروهای بازیکن برای رفتن به دیوارها و بام دروازه‌ها به پله نیاز دارند. آزمایشی؛ به‌طور پیش‌فرض خاموش است.
stairs_needed_ai: نیروهای هوش مصنوعی به پله نیاز دارند
stairs_needed_ai_tooltip: همین قانون برای بازیکنان هوش مصنوعی اعمال می‌شود. دیوارهای قلعه‌های بدون پله ممکن است بدون مدافع بمانند.
assassins_climb: آدم‌کشان همچنان از دیوار بالا می‌روند
assassins_climb_tooltip: آدم‌کشان با قلاب از دیوار بالا می‌روند، بنابراین قانون پله شامل آن‌ها نمی‌شود.
large_gatehouse_damage: آسیب دوربرد روی دروازهٔ بزرگ (٪)
large_gatehouse_damage_tooltip: نیروهای بالای دروازهٔ بزرگ این سهم از آسیب تیر، تیر زنبورک و سنگ فلاخن را می‌گیرند. نیروها روی دروازهٔ کوچک بیشتر دوام می‌آورند؛ برای برابر کردن آن را کم کنید. 100 = بدون تغییر.
remember_blocked: به خاطر سپردن مسیرهای بسته (لگ کمتر)
remember_blocked_tooltip: |-
  اگر قانون پله پس از آزمودن همهٔ دروازه‌ها راهی برای یک واحد نیابد، همان مسیر برای واحدهای بعدی مدت کوتاهی رد می‌شود و آن‌ها مستقیم سراغ مسیریابی خود بازی می‌روند. ارتشی که یکجا فرستاده می‌شود دیگر بازی را کند نمی‌کند.
remember_ticks: مدت به خاطر سپردن مسیر بسته (تیک بازی)
remember_ticks_tooltip: 100 تیک در سرعت عادی حدود دو ثانیه است.
centred_tooltip: فاصله را از مرکز دروازه اندازه می‌گیرد تا دشمنان از هر سمت در فاصلهٔ یکسانی دروازه را ببندند.
