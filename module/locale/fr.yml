bugfixes: Corrections
balance_changes: Modifications de l'équilibrage
enemy_gates_closed: Considérer les portes ennemies comme fermées
enemy_gates_closed_tooltip: |-
  Les troupes contournent les portes ennemies, même ouvertes. Les portes amies et capturées laissent toujours passer. Incompatible avec le raccourci d'escalade des assassins de Smarter Pathing ; la même restriction s'applique si l'une des règles d'escaliers est activée.
centred: Mesurer la distance de fermeture depuis le centre
reachable_only: Ignorer les ennemis ne pouvant pas atteindre la porte
reachable_only_tooltip: Les ennemis derrière des murs, des douves ou des falaises ne ferment pas la porte si leur zone est isolée.
stairs_needed: Les troupes humaines ont besoin d'escaliers
stairs_needed_tooltip: Les troupes humaines doivent utiliser des escaliers pour accéder aux murs et aux toits des portes. Expérimental ; désactivé par défaut.
stairs_needed_ai: Les troupes de l'IA ont besoin d'escaliers
stairs_needed_ai_tooltip: Applique la même règle aux joueurs IA. Les châteaux sans escaliers risquent de laisser leurs murs sans défenseurs.
assassins_climb: Les assassins continuent d'escalader les murs
assassins_climb_tooltip: Les assassins escaladent les murs avec leurs grappins ; la règle des escaliers ne s'applique donc pas à eux.
large_gatehouse_damage: Dégâts à distance sur une grande porte (%)
large_gatehouse_damage_tooltip: Les troupes postées au sommet d'une grande porte subissent cette proportion des dégâts de flèches, carreaux et pierres de fronde. Elles résistent mieux sur une petite porte ; baissez cette valeur pour équilibrer. 100 = inchangé.
remember_blocked: Mémoriser les trajets bloqués (moins de saccades)
remember_blocked_tooltip: |-
  Lorsque la règle des escaliers ne trouve aucun passage pour une unité après avoir essayé toutes les portes, le même trajet est brièvement ignoré pour les unités suivantes : elles passent directement à la recherche de chemin du jeu. Une armée envoyée d'un coup ne fait plus saccader le jeu.
remember_ticks: Mémoriser un trajet bloqué pendant (ticks de jeu)
remember_ticks_tooltip: 100 ticks correspondent à environ deux secondes à vitesse normale.
centred_tooltip: Mesure depuis le centre de la porte afin que les ennemis déclenchent la fermeture à la même distance de chaque côté.
tags.bugfixes: Corrections
tags.balance: Équilibrage
