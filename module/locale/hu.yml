bugfixes: Hibajavítások
balance_changes: Egyensúly-módosítások
enemy_gates_closed: Ellenséges kapuk zártnak tekintése
enemy_gates_closed_tooltip: |-
  A csapatok elkerülik az ellenséges kapukat, a nyitottakat is. A barátságos és elfoglalt kapukon továbbra is átkelhetnek. Együttműködik a Smarter Pathing orgyilkos-rövidítésével.
centred: Zárási távolság mérése a középponttól
reachable_only: A kaput el nem érő ellenségek figyelmen kívül hagyása
reachable_only_tooltip: A falak, várárkok vagy sziklák mögötti ellenségek nem zárják be a kaput, ha a területük nincs összeköttetésben.
stairs_needed: Az emberi csapatoknak lépcső kell
stairs_needed_tooltip: Az emberi csapatoknak lépcsőre van szükségük a falak és kapuházak tetejének eléréséhez. Kísérleti; alapértelmezés szerint kikapcsolva.
stairs_needed_ai: Az MI csapatainak is lépcső kell
stairs_needed_ai_tooltip: Ugyanez a szabály az MI-játékosokra is érvényes. A lépcső nélküli várak falai üresen maradhatnak.
assassins_climb: Az orgyilkosok továbbra is másznak falra
assassins_climb_tooltip: Az orgyilkosok a kampóikkal másznak fel a falakra, így rájuk nem vonatkozik a lépcsőszabály.
large_gatehouse_damage: Távolsági sebzés nagy kapuházon (%)
large_gatehouse_damage_tooltip: A nagy kapuház tetején álló csapatok a nyilak, számszeríj-nyílvesszők és parittyakövek sebzésének ennyi részét kapják. A kis kapuházon tovább bírják; csökkentsd a kiegyenlítéshez. 100 = változatlan.
remember_blocked: Elzárt utak megjegyzése (kevesebb akadás)
remember_blocked_tooltip: |-
  Ha a lépcsőszabály minden kapuház kipróbálása után sem talál utat egy egységnek, ugyanazt az utat rövid ideig átugorja a következő egységeknél: azok rögtön a játék saját útkeresését használják. Az egyszerre elindított sereg többé nem akasztja meg a játékot.
remember_ticks: Elzárt út megjegyzése ennyi ideig (játékütem)
remember_ticks_tooltip: 100 ütem normál sebességen nagyjából két másodperc.
centred_tooltip: A kapuház közepétől mér, így az ellenségek minden oldalról azonos távolságból váltják ki a bezáródást.
