bugfixes: Исправления
balance_changes: Изменения баланса
enemy_gates_closed: Считать вражеские ворота закрытыми
enemy_gates_closed_tooltip: |-
  Войска прокладывают путь в обход вражеских ворот, даже открытых. Дружественные и захваченные ворота по-прежнему пропускают. Работает вместе с сокращением пути ассасинов из Smarter Pathing.
centred: Измерять дистанцию закрытия от центра
reachable_only: Игнорировать врагов, неспособных дойти до ворот
reachable_only_tooltip: Враги за стенами, рвами или скалами не закрывают ворота, если их область отрезана.
stairs_needed: Войскам игрока нужны лестницы
stairs_needed_tooltip: Войскам игрока нужны лестницы для подъёма на стены и крыши ворот. Экспериментально; по умолчанию отключено.
stairs_needed_ai: Войскам ИИ нужны лестницы
stairs_needed_ai_tooltip: Применяет то же правило к ИИ. В замках без лестниц стены могут остаться без гарнизона.
assassins_climb: Ассасины по-прежнему взбираются на стены
assassins_climb_tooltip: Ассасины забираются на стены с помощью крюков, поэтому правило лестниц на них не действует.
large_gatehouse_damage: Урон от стрелков на больших воротах (%)
large_gatehouse_damage_tooltip: Войска на крыше больших ворот получают эту долю урона от стрел, арбалетных болтов и камней пращников. На малых воротах войска держатся дольше; уменьшите значение, чтобы уравнять их. 100 = без изменений.
remember_blocked: Запоминать заблокированные пути (меньше рывков)
remember_blocked_tooltip: |-
  Если правило лестниц не находит пути для юнита после проверки всех ворот, тот же маршрут ненадолго пропускается для следующих юнитов: они сразу используют обычный поиск пути игры. Армия, отправленная разом, больше не вызывает подтормаживаний.
remember_ticks: Помнить заблокированный путь (игровых тиков)
remember_ticks_tooltip: 100 тиков — около двух секунд на обычной скорости.
centred_tooltip: Измеряет расстояние от центра ворот, чтобы враги вызывали закрытие на одинаковой дистанции с любой стороны.
tags.bugfixes: Исправления
