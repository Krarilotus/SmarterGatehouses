bugfixes: Bugfixes
balance_changes: Balance Changes
enemy_gates_closed: Обходить вражеские ворота
enemy_gates_closed_tooltip: Бойцы обходят даже открытые вражеские ворота. Это правило и правила лестниц
  несовместимы с сокращением пути ассасинов.
centred: Расстояние от центра ворот
reachable_only: Игнорировать врагов без пути к воротам
reachable_only_tooltip: Враги за стенами, рвами или скалами не закрывают ворота, если их области не соединены.
stairs_needed: Войскам игрока нужны лестницы
stairs_needed_tooltip: Войскам игрока нужны лестницы для подъёма на стены и крыши ворот. Экспериментально;
  по умолчанию выключено.
stairs_needed_ai: Войскам ИИ нужны лестницы
stairs_needed_ai_tooltip: То же правило для ИИ. В замках без лестниц стены могут остаться без войск.
assassins_climb: Ассасины по-прежнему лазают
assassins_climb_tooltip: Ассасины взбираются на стены крюками, правило лестниц на них не действует.
large_gatehouse_damage: Урон от стрелков на больших воротах (%)
large_gatehouse_damage_tooltip: Войска на больших воротах получают эту долю урона от стрел, болтов и камней
  пращников. На малых воротах войска держатся дольше; уменьшите значение, чтобы уравнять. 100 = без изменений.
remember_blocked: Запоминать заблокированные пути (меньше рывков)
remember_blocked_tooltip: 'Если правило лестниц не нашло пути для отряда, перебрав все надвратные башни,
  тот же путь ненадолго пропускается для следующих отрядов: они сразу используют обычный поиск пути игры.
  Армия, отправленная разом, больше не вызывает подтормаживания.'
remember_ticks: Помнить заблокированный путь (игровых тиков)
remember_ticks_tooltip: 100 тиков — примерно две секунды на обычной скорости.
centred_tooltip: Ворота реагируют на врага с одинаковой дистанции с любой стороны.
