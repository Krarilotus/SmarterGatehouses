bugfixes: Hata düzeltmeleri
balance_changes: Denge değişiklikleri
enemy_gates_closed: Düşman kapılarını kapalı say
enemy_gates_closed_tooltip: |-
  Birlikler açık olanlar dâhil düşman kapılarının etrafından dolaşır. Dost ve ele geçirilmiş kapılar geçişe izin vermeye devam eder. Smarter Pathing'deki suikastçı kestirmesiyle birlikte çalışır.
centred: Kapanma mesafesini merkezden ölç
reachable_only: Kapıya ulaşamayan düşmanları yok say
reachable_only_tooltip: Bölgeleri bağlantısızsa sur, hendek veya uçurum arkasındaki düşmanlar kapıyı kapatmaz.
stairs_needed: Oyuncu birlikleri merdiven kullanmalı
stairs_needed_tooltip: Oyuncu birlikleri surlara ve kapı binası çatılarına çıkmak için merdivene ihtiyaç duyar. Deneysel; varsayılan olarak kapalı.
stairs_needed_ai: Yapay zekâ birlikleri de merdiven kullanmalı
stairs_needed_ai_tooltip: Aynı kuralı yapay zekâ oyuncularına uygular. Merdivensiz kalelerin surları boş kalabilir.
assassins_climb: Suikastçılar surlara tırmanmaya devam eder
assassins_climb_tooltip: Suikastçılar surlara kancalarıyla tırmandığından merdiven kuralı onları etkilemez.
large_gatehouse_damage: Büyük kapı binasında menzilli hasar (%)
large_gatehouse_damage_tooltip: Büyük kapı binasının üstünde duran birlikler ok, arbalet oku ve sapan taşlarından gelen hasarın bu kadarını alır. Küçük kapı binasında daha uzun dayanırlar; eşitlemek için bunu düşürün. 100 = değişmez.
remember_blocked: Engelli yolları hatırla (daha az takılma)
remember_blocked_tooltip: |-
  Merdiven kuralı tüm kapı binalarını denedikten sonra bir birim için yol bulamazsa, aynı yol sonraki birimler için kısa süre atlanır: doğrudan oyunun kendi yol bulmasını kullanırlar. Aynı anda gönderilen bir ordu artık oyunda takılmaya yol açmaz.
remember_ticks: Engelli yolu hatırlama süresi (oyun tıkı)
remember_ticks_tooltip: 100 tık normal hızda yaklaşık iki saniyedir.
centred_tooltip: Düşman hangi taraftan gelirse gelsin kapanmayı aynı mesafeden tetiklemesi için kapı binasının merkezinden ölçer.
