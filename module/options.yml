meta:
  version: 1.0.0
options:
- url: smarter-gatehouses.pathing.enemy_gates_closed
  name: smarter-gatehouses-pathing-enemy-gates-closed
  text: '{{enemy_gates_closed}}'
  tooltip: '{{enemy_gates_closed_tooltip}}'
  display: Switch
  contents:
    type: boolean
    value: true
  category:
  - '{{bugfixes}}'
- display: GroupBox
  category:
  - '{{bugfixes}}'
  header: '{{detection_group}}'
  hasHeader: true
  children:
  - url: smarter-gatehouses.detection.centred
    name: smarter-gatehouses-detection-centred
    text: '{{centred}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: smarter-gatehouses.detection.reachable_only
    name: smarter-gatehouses-detection-reachable-only
    text: '{{reachable_only}}'
    tooltip: '{{reachable_only_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
- display: GroupBox
  category:
  - '{{balance_changes}}'
  header: '{{walls_group}}'
  hasHeader: true
  children:
  - url: smarter-gatehouses.walls.stairs_needed
    name: smarter-gatehouses-walls-stairs-needed
    text: '{{stairs_needed}}'
    tooltip: '{{stairs_needed_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: false
  - url: smarter-gatehouses.walls.stairs_needed_ai
    name: smarter-gatehouses-walls-stairs-needed-ai
    text: '{{stairs_needed_ai}}'
    tooltip: '{{stairs_needed_ai_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: false
