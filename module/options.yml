meta:
  version: 1.0.0
options:
- url: smarter-gatehouses.pathing.enemy_gates_closed
  name: smarter-gatehouses-pathing-enemy-gates-closed
  text: '{{enemy_gates_closed}}'
  tooltip: '{{enemy_gates_closed_tooltip}}'
  display: Switch
  contents:
    type: boolean
    value: true
  category:
  - '{{bugfixes}}'
- url: smarter-gatehouses.pathing.remember_blocked
  name: smarter-gatehouses-pathing-remember-blocked
  text: '{{remember_blocked}}'
  tooltip: '{{remember_blocked_tooltip}}'
  display: Switch
  contents:
    type: boolean
    value: true
  category:
  - '{{bugfixes}}'
- url: smarter-gatehouses.pathing.remember_ticks
  name: smarter-gatehouses-pathing-remember-ticks
  text: '{{remember_ticks}}'
  tooltip: '{{remember_ticks_tooltip}}'
  display: Number
  contents:
    type: integer
    value: 100
    min: 10
    max: 1000
    step: 10
  category:
  - '{{bugfixes}}'
- display: GroupBox
  category:
  - '{{bugfixes}}'
  header: '{{detection_group}}'
  hasHeader: true
  children:
  - url: smarter-gatehouses.detection.centred
    name: smarter-gatehouses-detection-centred
    text: '{{centred}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: smarter-gatehouses.detection.reachable_only
    name: smarter-gatehouses-detection-reachable-only
    text: '{{reachable_only}}'
    tooltip: '{{reachable_only_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
- display: GroupBox
  category:
  - '{{balance_changes}}'
  header: '{{walls_group}}'
  hasHeader: true
  children:
  - url: smarter-gatehouses.walls.stairs_needed
    name: smarter-gatehouses-walls-stairs-needed
    text: '{{stairs_needed}}'
    tooltip: '{{stairs_needed_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: false
  - url: smarter-gatehouses.walls.stairs_needed_ai
    name: smarter-gatehouses-walls-stairs-needed-ai
    text: '{{stairs_needed_ai}}'
    tooltip: '{{stairs_needed_ai_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: false
  - url: smarter-gatehouses.walls.assassins_climb
    name: smarter-gatehouses-walls-assassins-climb
    text: '{{assassins_climb}}'
    tooltip: '{{assassins_climb_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
- display: GroupBox
  category:
  - '{{balance_changes}}'
  header: '{{damage_group}}'
  hasHeader: true
  children:
  - url: smarter-gatehouses.damage.large_gatehouse
    name: smarter-gatehouses-damage-large-gatehouse
    text: '{{large_gatehouse_damage}}'
    tooltip: '{{large_gatehouse_damage_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 100
      min: 10
      max: 100
      step: 5
